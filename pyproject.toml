[project]
name = "campaign-qa-agent"
version = "0.1.0"
description = "Campaign QA & Launch Governance Agent — validates marketing campaigns before launch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Campaign QA & Launch Governance Agent Contributors" },
]
dependencies = [
    "streamlit>=1.37",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
